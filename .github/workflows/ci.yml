name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'analysis[dev]'
      - run: ruff check analysis/src analysis/tests
      - run: pytest -q analysis/tests
